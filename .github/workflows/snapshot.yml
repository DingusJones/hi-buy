name: Ingest public snapshot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: public-snapshot
  cancel-in-progress: false
jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/snapshot.mjs
        timeout-minutes: 3
      - name: Commit changed snapshot only
        run: |
          git add public/live/latest.json
          if git diff --cached --quiet; then
            echo 'No snapshot changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: update public snapshot'
          git push origin HEAD:main
